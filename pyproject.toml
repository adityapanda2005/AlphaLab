[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "alphalab"
version = "0.1.0"
description = "Alpha Research & Backtesting Engine"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "pyarrow>=12.0",
]

[project.optional-dependencies]
realdata = ["yfinance>=0.2"]
plot = ["matplotlib>=3.7"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
]
all = ["alphalab[realdata,plot,dev]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::RuntimeWarning"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 88
select = ["E", "F", "W", "I"]
